x<div class="contenedor-login">
  <h2>Iniciar Sesión</h2>
  
  <p class="alerta error" *ngIf="mensajeError()">{{ mensajeError() }}</p>

  <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
    <input type="email" formControlName="email" placeholder="Correo electrónico">
    <input type="password" formControlName="password" placeholder="Contraseña">

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Entrando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="footer-link">
    ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
  </p>
</div>
